<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Match Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #14213d;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      color: #dbe4f0;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      padding: 16px 10px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
      text-align: center;
    }

    .summary-card h2 {
      margin: 0;
      color: #2563eb;
      font-size: 25px;
    }

    .summary-card p {
      margin: 8px 0 0;
      font-size: 12px;
      color: #64748b;
    }

    .updated {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input,
    select {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    #searchInput {
      flex: 1;
      min-width: 180px;
    }

    #locationFilter {
      min-width: 150px;
    }

    .job-list {
      display: grid;
      gap: 14px;
    }

    .job-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
      border-left: 4px solid #2563eb;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .job-title {
      font-size: 17px;
      margin: 0 0 8px;
      color: #172033;
    }

    .company {
      font-weight: bold;
      color: #475569;
      margin-bottom: 7px;
    }

    .location {
      color: #64748b;
      font-size: 13px;
    }

    .score {
      background: #dcfce7;
      color: #166534;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: bold;
      white-space: nowrap;
      font-size: 14px;
    }

    .skills {
      margin-top: 14px;
      font-size: 13px;
      color: #475569;
      line-height: 1.7;
    }

    .job-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .apply-button,
    .details-button {
      display: inline-block;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .apply-button {
      background: #2563eb;
      color: white;
    }

    .details-button {
      background: #e2e8f0;
      color: #172033;
    }

    .details {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.7;
    }

    .details.show {
      display: block;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      color: #64748b;
    }

    footer {
      text-align: center;
      padding: 22px 12px;
      color: #64748b;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .summary {
        gap: 8px;
      }

      .summary-card {
        padding: 14px 6px;
      }

      .summary-card h2 {
        font-size: 22px;
      }

      .summary-card p {
        font-size: 11px;
      }

      .job-header {
        flex-direction: column;
      }

      .score {
        align-self: flex-start;
      }

      #searchInput,
      #locationFilter {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎯 Job Match Dashboard</h1>
    <p>Find QA & Playwright jobs matching your profile</p>
  </header>

  <main class="container">

    <section class="summary">
      <div class="summary-card">
        <h2 id="totalJobs">0</h2>
        <p>Jobs Fetched</p>
      </div>

      <div class="summary-card">
        <h2 id="matchedJobs">0</h2>
        <p>Matching Jobs</p>
      </div>

      <div class="summary-card">
        <h2 id="topScore">0%</h2>
        <p>Highest Match</p>
      </div>
    </section>

    <div class="updated" id="lastUpdated">
      Loading job data...
    </div>

    <section class="toolbar">
      <input
        type="search"
        id="searchInput"
        placeholder="Search job title or company..."
      >

      <select id="locationFilter">
        <option value="all">All Locations</option>
        <option value="Chennai">Chennai</option>
        <option value="Bengaluru">Bengaluru</option>
        <option value="Hyderabad">Hyderabad</option>
      </select>
    </section>

    <section id="jobList" class="job-list">
      <div class="empty">Loading matching jobs...</div>
    </section>

  </main>

  <footer>
    Job Match Dashboard | Apply manually through the job links
  </footer>

  <script>
    let allJobs = [];

    async function loadJobs() {
      const jobList = document.getElementById("jobList");

      try {
        const response = await fetch("./jobs.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error("Could not load jobs.json");
        }

        const data = await response.json();

        allJobs = Array.isArray(data.jobs) ? data.jobs : [];

        document.getElementById("totalJobs").textContent =
          data.totalJobsFetched || 0;

        document.getElementById("matchedJobs").textContent =
          allJobs.length;

        const highestScore = allJobs.length
          ? Math.max(...allJobs.map(job => Number(job.matchScore) || 0))
          : 0;

        document.getElementById("topScore").textContent =
          highestScore + "%";

        if (data.generatedAt) {
          const date = new Date(data.generatedAt);

          document.getElementById("lastUpdated").textContent =
            "Last Updated: " + date.toLocaleString("en-IN");
        } else {
          document.getElementById("lastUpdated").textContent =
            "Job data loaded";
        }

        renderJobs();

      } catch (error) {
        jobList.innerHTML = `
          <div class="empty">
            Unable to load jobs.<br><br>
            Please check that jobs.json exists and the dashboard
            is opened through GitHub Pages.
          </div>
        `;
      }
    }

    function renderJobs() {
      const searchText = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

      const selectedLocation = document
        .getElementById("locationFilter")
        .value
        .toLowerCase();

      const filteredJobs = allJobs.filter(job => {
        const title = String(job.title || "").toLowerCase();
        const company = String(job.company || "").toLowerCase();
        const location = String(job.location || "").toLowerCase();

        const matchesSearch =
          title.includes(searchText) ||
          company.includes(searchText);

        const matchesLocation =
          selectedLocation === "all" ||
          location.includes(selectedLocation);

        return matchesSearch && matchesLocation;
      });

      const jobList = document.getElementById("jobList");

      if (filteredJobs.length === 0) {
        jobList.innerHTML = `
          <div class="empty">
            No matching jobs found for this search.
          </div>
        `;
        return;
      }

      jobList.innerHTML = filteredJobs.map((job, index) => {
        const title = escapeHTML(job.title || "Job Title Not Available");
        const company = escapeHTML(job.company || "Company Not Available");
        const location = escapeHTML(job.location || "Location Not Available");
        const score = Number(job.matchScore) || 0;

        const skills = Array.isArray(job.matchedSkills)
          ? job.matchedSkills.map(escapeHTML).join(", ")
          : "Not available";

        const reasons = Array.isArray(job.reasons)
          ? job.reasons
          : ["Meets matching criteria"];

        const applyLink = safeURL(job.applyLink);

        const applyButton = applyLink
          ? `<a class="apply-button"
                href="${applyLink}"
                target="_blank"
                rel="noopener noreferrer">Apply Now ↗</a>`
          : `<button class="details-button" disabled>
                Apply Link Not Available
             </button>`;

        return `
          <article class="job-card">

            <div class="job-header">
              <div>
                <h2 class="job-title">${title}</h2>
                <div class="company">${company}</div>
                <div class="location">📍 ${location}</div>
              </div>

              <div class="score">${score}% Match</div>
            </div>

            <div class="skills">
              <strong>Matched Skills:</strong> ${skills}
            </div>

            <div class="job-actions">
              ${applyButton}

              <button
                class="details-button"
                onclick="toggleDetails(${index})">
                View Details
              </button>
            </div>

            <div class="details" id="details-${index}">
              <strong>Match Reasons</strong>
              <ul>
                ${reasons.map(reason =>
                  `<li>${escapeHTML(reason)}</li>`
                ).join("")}
              </ul>
            </div>

          </article>
        `;
      }).join("");
    }

    function toggleDetails(index) {
      const details = document.getElementById("details-" + index);

      if (details) {
        details.classList.toggle("show");
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safeURL(value) {
      try {
        const url = new URL(value);

        if (url.protocol === "https:" || url.protocol === "http:") {
          return escapeHTML(url.href);
        }
      } catch (error) {
        return "";
      }

      return "";
    }

    document
      .getElementById("searchInput")
      .addEventListener("input", renderJobs);

    document
      .getElementById("locationFilter")
      .addEventListener("change", renderJobs);

    loadJobs();
  </script>

</body>
</html>
