<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Match Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #14213d;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 8px 0 0;
      color: #dbe4f0;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: white;
      padding: 18px 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
      text-align: center;
    }

    .summary-card h2 {
      margin: 0;
      color: #2563eb;
      font-size: 25px;
    }

    .summary-card p {
      margin: 8px 0 0;
      font-size: 12px;
      color: #64748b;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input,
    select,
    button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d5dce8;
      font-size: 14px;
    }

    input,
    select {
      background: white;
      flex: 1;
      min-width: 140px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .job-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px #0000000a;
      border: 1px solid #e5eaf2;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .job-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 8px;
    }

    .company {
      color: #475569;
      margin-bottom: 8px;
    }

    .location {
      color: #64748b;
      font-size: 14px;
    }

    .score {
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      padding: 8px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .skills {
      margin-top: 14px;
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
    }

    .job-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .apply-button {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .apply-button:hover {
      background: #15803d;
    }

    .details-button {
      background: #e2e8f0;
      color: #1e293b;
    }

    .details-button:hover {
      background: #cbd5e1;
    }

    .details {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      color: #475569;
    }

    .details.show {
      display: block;
    }

    .message {
      text-align: center;
      background: white;
      padding: 28px 16px;
      border-radius: 12px;
      color: #64748b;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 24px 12px;
    }

    @media (max-width: 600px) {
      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .summary-card:last-child {
        grid-column: span 2;
      }

      .job-header {
        flex-direction: column;
      }

      .score {
        align-self: flex-start;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎯 Job Match Dashboard</h1>
    <p>Find QA & Manual Testing jobs that match your profile</p>
  </header>

  <main class="container">
    <section class="summary">
      <div class="summary-card">
        <h2 id="totalJobs">0</h2>
        <p>Matching Jobs</p>
      </div>

      <div class="summary-card">
        <h2 id="bestScore">0%</h2>
        <p>Best Match</p>
      </div>

      <div class="summary-card">
        <h2 id="lastUpdated">--</h2>
        <p>Last Updated</p>
      </div>
    </section>

    <section class="toolbar">
      <input
        type="text"
        id="searchInput"
        placeholder="Search job, company or skill..."
      >

      <select id="locationFilter">
        <option value="all">All Locations</option>
        <option value="Chennai">Chennai</option>
        <option value="Bengaluru">Bengaluru</option>
        <option value="Hyderabad">Hyderabad</option>
      </select>

      <button onclick="loadJobs()">Refresh Jobs</button>
    </section>

    <section id="jobsContainer">
      <div class="message">Loading matching jobs...</div>
    </section>
  </main>

  <footer>
    Job Match Dashboard | Apply manually through the job application link
  </footer>

  <script>
    let allJobs = [];

    async function loadJobs() {
      const container = document.getElementById("jobsContainer");

      container.innerHTML =
        '<div class="message">Loading latest job matches...</div>';

      try {
        const response = await fetch("jobs.json?t=" + Date.now());

        if (!response.ok) {
          throw new Error("Unable to load jobs.json");
        }

        const data = await response.json();

        allJobs = Array.isArray(data.jobs) ? data.jobs : [];

        document.getElementById("totalJobs").textContent =
          allJobs.length;

        const bestScore = allJobs.length
          ? Math.max(...allJobs.map(job => Number(job.matchScore) || 0))
          : 0;

        document.getElementById("bestScore").textContent =
          bestScore + "%";

        document.getElementById("lastUpdated").textContent =
          data.generatedAt
            ? new Date(data.generatedAt).toLocaleString()
            : "--";

        renderJobs();
      } catch (error) {
        container.innerHTML = `
          <div class="message">
            <h3>Jobs are not available yet</h3>
            <p>Please run the GitHub Job Agent workflow first.</p>
            <p>Make sure jobs.json is present in the repository.</p>
          </div>
        `;
      }
    }

    function renderJobs() {
      const container = document.getElementById("jobsContainer");
      const searchText = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

      const selectedLocation = document
        .getElementById("locationFilter")
        .value;

      const filteredJobs = allJobs.filter(job => {
        const searchableText = [
          job.title,
          job.company,
          job.location,
          ...(job.matchedSkills || [])
        ]
          .join(" ")
          .toLowerCase();

        const matchesSearch = searchableText.includes(searchText);

        const matchesLocation =
          selectedLocation === "all" ||
          (job.location || "")
            .toLowerCase()
            .includes(selectedLocation.toLowerCase());

        return matchesSearch && matchesLocation;
      });

      if (filteredJobs.length === 0) {
        container.innerHTML = `
          <div class="message">
            <h3>No matching jobs found</h3>
            <p>Try changing your search or location filter.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredJobs.map((job, index) => {
        const title = escapeHTML(job.title || "Job title not available");
        const company = escapeHTML(job.company || "Company not available");
        const location = escapeHTML(job.location || "Location not available");
        const score = Number(job.matchScore) || 0;

        const skills = (job.matchedSkills || [])
          .map(skill => escapeHTML(skill))
          .join(", ") || "No matched skills listed";

        const applyLink = safeURL(job.applyLink);

        const applyButton = applyLink
          ? `<a class="apply-button"
                href="${applyLink}"
                target="_blank"
                rel="noopener noreferrer">Apply Now ↗</a>`
          : `<button disabled>No Apply Link</button>`;

        return `
          <article class="job-card">
            <div class="job-header">
              <div>
                <h2 class="job-title">${title}</h2>
                <div class="company">${company}</div>
                <div class="location">📍 ${location}</div>
              </div>

              <div class="score">${score}% Match</div>
            </div>

            <div class="skills">
              <strong>Matched Skills:</strong> ${skills}
            </div>

            <div class="job-actions">
              ${applyButton}
              <button class="details-button"
                onclick="toggleDetails(${index})">
                View Details
              </button>
            </div>

            <div class="details" id="details-${index}">
              <strong>Match Reasons:</strong>
              <ul>
                ${(job.reasons || ["Meets matching criteria"])
                  .map(reason => `<li>${escapeHTML(reason)}</li>`)
                  .join("")}
              </ul>
            </div>
          </article>
        `;
      }).join("");
    }

    function toggleDetails(index) {
      const details = document.getElementById("details-" + index);

      if (details) {
        details.classList.toggle("show");
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function safeURL(value) {
      try {
        const url = new URL(value);

        if (url.protocol === "https:" || url.protocol === "http:") {
          return escapeHTML(url.href);
        }
      } catch (error) {
        return "";
      }

      return "";
    }

    document
      .getElementById("searchInput")
      .addEventListener("input", renderJobs);

    document
      .getElementById("locationFilter")
      .addEventListener("change", renderJobs);

    loadJobs();
  </script>
</body>
</html>
